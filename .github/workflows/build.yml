name: build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # 发布任务：把仓库 dist/ 目录中维护好的发布文件（与 sha256sums.txt 一一对应）
  # 原样上传到对应 tag 的发布页，保证发布资产与校验清单永远一致。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite: true
